# CI pipeline: 1. eslint  ->  2. build tests  ->  3. smoke tests
#
# Stage 3 runs the @smoke scenarios headless again
# PolicyCenter replica (github.com/syed-git/personal-auto-policy-center, port 3000 = ENV=uat2).
# The HTML dashboard (output/dashboard) and failure screenshots are uploaded as artifacts.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Test data comes from the auto-graystone-data service. The browser stages start it locally
  # (cloned from DATA_API_REPO) instead of relying on the Render instance waking up in time.
  DATA_API_REPO: https://github.com/syed-git/auto-graystone-data.git
  # TODO: switch to master once syed-git/auto-graystone-data#1 is merged
  DATA_API_REF: devin/1789937796-graystone-data-api
  DATA_API_URL: http://localhost:4000

jobs:
  eslint:
    name: 1. ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run lint

  build-tests:
    name: 2. Build tests
    needs: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npx puppeteer browsers install chrome
      # node:test unit tests: data API client + GrayStoneHelper, flows and dashboard renderer (no browser)
      - run: npm run test:unit
      - name: Start auto-graystone-data
        run: |
          git clone --depth 1 --branch "$DATA_API_REF" "$DATA_API_REPO" "$RUNNER_TEMP/auto-graystone-data"
          cd "$RUNNER_TEMP/auto-graystone-data"
          npm ci --omit=dev
          PORT=4000 nohup npm start > "$RUNNER_TEMP/auto-graystone-data.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/health && break; sleep 1; done
          curl -fs -X POST "$DATA_API_URL/getAutoGraystoneData"
      - run: npm run test:build

  smoke-tests:
    name: 2. Smoke tests
    needs: build-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npx puppeteer browsers install chrome
      - name: Start auto-graystone-data
        run: |
          git clone --depth 1 --branch "$DATA_API_REF" "$DATA_API_REPO" "$RUNNER_TEMP/auto-graystone-data"
          cd "$RUNNER_TEMP/auto-graystone-data"
          npm ci --omit=dev
          PORT=4000 nohup npm start > "$RUNNER_TEMP/auto-graystone-data.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/health && break; sleep 1; done
          curl -fs -X POST "$DATA_API_URL/getAutoGraystoneData"
      - run: npm run test:smoke
