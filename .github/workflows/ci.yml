# CI pipeline: 1. eslint  ->  2. build tests  ->  3. smoke tests
#
# Stage 3 runs the @smoke scenarios headless again
# PolicyCenter replica (github.com/syed-git/personal-auto-policy-center, port 3000 = ENV=uat2).
# The HTML dashboard (output/dashboard) and failure screenshots are uploaded as artifacts.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  eslint:
    name: 1. ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run lint

  build-tests:
    name: 2. Build tests
    needs: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npx puppeteer browsers install chrome
      # codeceptjs dry-run loads the config, helpers, plugins and every *_test.js without a browser,
      # then the node:test unit tests cover the data generator, flows and dashboard renderer.
      - run: npm run test:build

  smoke-tests:
    name: 2. Smoke tests
    needs: build-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npx puppeteer browsers install chrome
      # codeceptjs dry-run loads the config, helpers, plugins and every *_test.js without a browser,
      # then the node:test unit tests cover the data generator, flows and dashboard renderer.
      - run: npm run test:smoke
